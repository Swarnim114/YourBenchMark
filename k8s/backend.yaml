---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: ybm-backend:IMAGE_TAG
          ports:
            - containerPort: 5000
          envFrom:
            - secretRef:
                name: ybm-secrets # MONGODB_URI, JWT_SECRET
          readinessProbe:
            httpGet:
              path: /readyz
              port: 5000
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5000
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 256Mi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000 # "node" user in the image
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: backend # nginx.conf proxies /users to this name
spec:
  selector:
    app: backend
  ports:
    - port: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: backend-pods # headless: DNS returns every pod IP so Prometheus scrapes each pod
spec:
  clusterIP: None
  selector:
    app: backend
  ports:
    - port: 5000
