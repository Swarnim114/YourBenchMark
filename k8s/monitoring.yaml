---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    rule_files:
      - /etc/prometheus/alerts.yml
    scrape_configs:
      - job_name: backend
        dns_sd_configs:
          - names: [backend-pods.default.svc.cluster.local]
            type: A
            port: 5000
  alerts.yml: |
    groups:
      - name: backend
        rules:
          # A backend pod stopped answering scrapes
          - alert: BackendDown
            expr: up{job="backend"} == 0
            for: 1m
          # More than 5% of API requests fail with a 5xx error
          - alert: HighErrorRate
            expr: |
              sum(rate(http_requests_total{route=~"/users.*",status=~"5.."}[5m]))
                / sum(rate(http_requests_total{route=~"/users.*"}[5m])) > 0.05
            for: 5m
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.1
          args: [--config.file=/etc/prometheus/prometheus.yml]
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 250m, memory: 512Mi }
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
