name: CI

on:
  push:
  pull_request:

jobs:
  # 1. Code quality: fails on ESLint errors, warnings are only shown
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx eslint src

  # 2. Dependency security
  audit:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Backend runtime dependencies must have no high/critical vulnerabilities
      - name: Audit backend dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: server

      # Frontend deps are build-time tooling (react-scripts); only static files ship, so report only
      - name: Audit frontend dependencies (report only)
        run: npm audit --omit=dev --audit-level=critical || true

  # 3. Build images tagged with the commit SHA and scan them
  build-and-scan:
    needs: audit
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: |
          docker build -t ybm-backend:$TAG server
          docker build -t ybm-frontend:$TAG .

      - name: Scan images
        run: |
          for img in ybm-backend ybm-frontend; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.56.2 \
              image --exit-code 1 --severity CRITICAL --ignore-unfixed $img:$TAG
          done
